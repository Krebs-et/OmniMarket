name: OmniMarket CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnimarket
          POSTGRES_PASSWORD: omnimarket_ci
          POSTGRES_DB: omnimarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnimarket -d omnimarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://omnimarket:omnimarket_ci@localhost:5432/omnimarket
      AUTH_SECRET: ci-only-secret
      DEMO_EMAIL: demo@omnimarket.local
      DEMO_PASSWORD: omnimarket
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm test:integration

  e2e:
    name: Playwright E2E
    needs: [quality, integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnimarket
          POSTGRES_PASSWORD: omnimarket_ci
          POSTGRES_DB: omnimarket
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U omnimarket -d omnimarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://omnimarket:omnimarket_ci@localhost:5434/omnimarket
      AUTH_SECRET: ci-only-secret
      DEMO_EMAIL: demo@omnimarket.local
      DEMO_PASSWORD: omnimarket
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://omnimarket:omnimarket_ci@localhost:5434/omnimarket
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
