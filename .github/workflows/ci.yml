name: OmniMarket CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnimarket
          POSTGRES_PASSWORD: omnimarket_ci
          POSTGRES_DB: omnimarket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omnimarket -d omnimarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://omnimarket:omnimarket_ci@localhost:5432/omnimarket
      AUTH_SECRET: ci-only-secret
      DEMO_EMAIL: demo@omnimarket.local
      DEMO_PASSWORD: omnimarket
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Drizzle migration metadata
        run: |
          test -s drizzle/meta/_journal.json || { echo "::error::Missing drizzle/meta/_journal.json; commit Drizzle migration metadata."; exit 1; }
          node -e "const fs=require('node:fs'); const path=require('node:path'); const journal=JSON.parse(fs.readFileSync('drizzle/meta/_journal.json','utf8')); if (!Array.isArray(journal.entries) || journal.entries.length === 0) throw new Error('Drizzle migration journal has no entries'); for (const entry of journal.entries) { if (!fs.existsSync(path.join('drizzle', entry.tag + '.sql'))) throw new Error('Missing Drizzle migration SQL: ' + entry.tag); }"
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm test:integration

  e2e:
    name: Playwright E2E
    needs: [quality, integration]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: omnimarket
          POSTGRES_PASSWORD: omnimarket_ci
          POSTGRES_DB: omnimarket
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U omnimarket -d omnimarket"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://omnimarket:omnimarket_ci@localhost:5434/omnimarket
      AUTH_SECRET: ci-only-secret
      DEMO_EMAIL: demo@omnimarket.local
      DEMO_PASSWORD: omnimarket
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Drizzle migration metadata
        run: |
          test -s drizzle/meta/_journal.json || { echo "::error::Missing drizzle/meta/_journal.json; commit Drizzle migration metadata."; exit 1; }
          node -e "const fs=require('node:fs'); const path=require('node:path'); const journal=JSON.parse(fs.readFileSync('drizzle/meta/_journal.json','utf8')); if (!Array.isArray(journal.entries) || journal.entries.length === 0) throw new Error('Drizzle migration journal has no entries'); for (const entry of journal.entries) { if (!fs.existsSync(path.join('drizzle', entry.tag + '.sql'))) throw new Error('Missing Drizzle migration SQL: ' + entry.tag); }"
      - run: pnpm db:migrate:deploy
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          DATABASE_URL: postgres://omnimarket:omnimarket_ci@localhost:5434/omnimarket
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
